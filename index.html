<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🀄 麻將積分統計表</title>
<meta property="og:title" content="🀄 麻將積分統計表">
<meta property="og:description" content="和朋友每個月結算的麻將分數統計">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark: #0b3d1a;
    --green-mid: #1a5d2a;
    --green-light: #2e7d32;
    --gold: #ffdd99;
    --red: #c5172e;
    --bg-grad: linear-gradient(135deg, #0a2e15 0%, #1a4d2e 40%, #2a6d3e 70%, #3a7d4e 100%);
  }
  body {
    font-family: -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: var(--bg-grad);
    min-height: 100vh; color: #fff; padding: 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.8em; margin: 16px 0 4px; }
  .subtitle { text-align: center; color: var(--gold); margin-bottom: 20px; font-size: 0.95em; }

  .nav { display: flex; gap: 4px; margin-bottom: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 4px; }
  .nav button {
    flex: 1; padding: 12px 4px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.9em; font-weight: bold; transition: all .2s; background: transparent; color: #ccc;
  }
  .nav button.active { background: var(--green-light); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

  .card {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 20px; margin-bottom: 16px; backdrop-filter: blur(6px);
  }
  .card h2 { font-size: 1.2em; margin-bottom: 14px; color: var(--gold); }

  .btn {
    display: inline-block; padding: 12px 28px; border: none; border-radius: 10px;
    font-size: 1em; font-weight: bold; cursor: pointer; transition: transform .15s, box-shadow .15s;
    text-decoration: none; text-align: center;
  }
  .btn-primary { background: linear-gradient(135deg,#e74c3c,#c0392b); color: #fff; box-shadow: 0 4px 14px rgba(231,76,60,0.4); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(231,76,60,0.55); }
  .btn-green { background: linear-gradient(135deg,#2ecc71,#27ae60); color: #fff; box-shadow: 0 4px 14px rgba(46,204,113,0.4); }
  .btn-green:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,204,113,0.55); }
  .btn-sm { padding: 6px 14px; font-size: 0.8em; }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; }
  .btn-outline:hover { background: rgba(255,255,255,0.1); }
  .btn-add { background: rgba(255,255,255,0.15); border: 1px dashed rgba(255,255,255,0.3); color: var(--gold); }
  .btn-add:hover { background: rgba(255,255,255,0.2); }
  .center { text-align: center; }
  .hidden { display: none; }

  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 12px 14px; border: none; border-radius: 8px;
    font-size: 1em; background: rgba(255,255,255,0.95); color: #222; margin-bottom: 10px;
  }
  label { display: block; color: var(--gold); font-size: 0.85em; margin-bottom: 4px; }

  .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .score-item { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 12px; }
  .score-item .pname { font-weight: bold; color: var(--gold); margin-bottom: 8px; font-size: 0.95em; }
  .score-item input { margin-bottom: 0; text-align: center; font-size: 1.2em; font-weight: bold; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9em; }
  th { color: var(--gold); font-weight: bold; }
  .pos { color: #69f0ae; font-weight: bold; }
  .neg { color: #ff8a80; font-weight: bold; }
  .zero { color: #bbb; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat-card .label { font-size: 0.8em; color: #ccc; margin-bottom: 4px; }
  .stat-card .value { font-size: 1.6em; font-weight: bold; }

  .game-record {
    background: rgba(0,0,0,0.15); border-radius: 10px; padding: 14px; margin-bottom: 10px;
    border-left: 4px solid var(--green-light);
  }
  .game-record .date { color: var(--gold); font-size: 0.95em; font-weight: bold; margin-bottom: 8px; }
  .game-record .scores { display: flex; flex-wrap: wrap; gap: 8px; }
  .game-record .score-chip {
    background: rgba(255,255,255,0.1); border-radius: 6px; padding: 4px 10px; font-size: 0.85em;
  }
  .game-record .note { color: #aaa; font-size: 0.8em; margin-top: 6px; }
  .game-record .actions { margin-top: 8px; display: flex; gap: 8px; }

  .month-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .month-bar select { margin-bottom: 0; flex: 1; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px; border-radius: 10px;
    font-size: 0.95em; z-index: 9999; transition: opacity .3s; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .modal {
    background: #1a4d2e; border-radius: 14px; padding: 24px; max-width: 400px; width: 100%;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .modal h3 { color: var(--gold); margin-bottom: 12px; }

  .chart-bar-container { margin-bottom: 16px; }
  .chart-bar-label { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 4px; }
  .chart-bar-track { background: rgba(0,0,0,0.3); border-radius: 6px; height: 24px; position: relative; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 6px; transition: width .5s; }

  .empty-msg { text-align: center; color: #aaa; padding: 40px 20px; font-size: 0.95em; }
  .note-text { font-size: 0.82em; color: #ccc; line-height: 1.6; margin-top: 12px; }
  .note-text li { margin-bottom: 4px; margin-left: 18px; }

  .player-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .player-row input { flex: 1; margin-bottom: 0; }
  .player-row .remove-btn {
    flex: 0 0 auto; background: #c0392b; color: #fff; border: none; border-radius: 8px;
    width: 40px; height: 40px; font-size: 1.1em; cursor: pointer;
  }

  .player-pick {
    display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.15);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer;
    transition: background .2s;
  }
  .player-pick:hover { background: rgba(0,0,0,0.25); }
  .player-pick .checkbox {
    width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; font-size: 0.9em; flex: 0 0 auto;
  }
  .player-pick.checked .checkbox { background: var(--green-light); border-color: var(--green-light); }
  .player-pick .pname { flex: 1; font-weight: bold; }
  .player-pick .score-area { flex: 0 0 auto; display: none; align-items: center; gap: 6px; }
  .player-pick .score-area.active { display: flex; }
  .player-pick .wl-btn {
    padding: 6px 14px; border: none; border-radius: 8px; font-size: 0.85em; font-weight: bold;
    cursor: pointer; transition: all .15s;
  }
  .player-pick .wl-win { background: rgba(46,204,113,0.2); color: #69f0ae; border: 1px solid rgba(46,204,113,0.4); }
  .player-pick .wl-win.active { background: #27ae60; color: #fff; }
  .player-pick .wl-lose { background: rgba(231,76,60,0.2); color: #ff8a80; border: 1px solid rgba(231,76,60,0.4); }
  .player-pick .wl-lose.active { background: #c0392b; color: #fff; }
  .player-pick .score-input { width: 90px; text-align: center; font-size: 1.1em; font-weight: bold; margin: 0; }

  @media (max-width: 480px) {
    h1 { font-size: 1.5em; }
    .score-grid { grid-template-columns: 1fr 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🀄 麻將積分統計表</h1>
  <div class="subtitle">和朋友每個月結算的分數紀錄</div>

  <div class="nav">
    <button id="tab-home" class="active" onclick="showTab('home')">📊 總覽</button>
    <button id="tab-add" onclick="showTab('add')">➕ 新增</button>
    <button id="tab-history" onclick="showTab('history')">📋 歷史</button>
    <button id="tab-settings" onclick="showTab('settings')">⚙️ 設定</button>
  </div>

  <!-- ==================== Home ==================== -->
  <div id="view-home">
    <div class="card">
      <h2>📅 本月戰況 — <span id="currentMonthLabel"></span></h2>
      <div class="stats-grid" id="monthStats"></div>
      <div id="monthChart"></div>
      <div id="monthGames"></div>
    </div>
    <div class="card">
      <h2>🏆 累計總積分</h2>
      <div id="totalChart"></div>
      <div class="stats-grid" id="totalStats"></div>
    </div>
    <div class="card">
      <h2>📌 月結算一覽</h2>
      <div id="monthlySummary"></div>
    </div>
  </div>

  <!-- ==================== Add Game ==================== -->
  <div id="view-add" class="hidden">
    <div class="card">
      <h2>➕ 新增一場紀錄</h2>
      <label>日期</label>
      <input type="date" id="gameDate">
      <label>勾選本場參與者，並輸入分數（贏為正、輸為負，合計應為 0）</label>
      <div id="playerPickList"></div>
      <div id="sumWarn" style="margin: 10px 0; font-size: 0.9em;"></div>
      <label>備註（選填）</label>
      <input type="text" id="gameNote" placeholder="例：阿明家">
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-green" style="flex:1;" onclick="saveGame()">💾 儲存</button>
        <button class="btn btn-outline" onclick="resetForm()">清除</button>
      </div>
    </div>
  </div>

  <!-- ==================== History ==================== -->
  <div id="view-history" class="hidden">
    <div class="card">
      <h2>📋 歷史紀錄</h2>
      <div class="month-bar">
        <label style="margin:0;">篩選月份</label>
        <select id="historyMonth" onchange="renderHistory()">
          <option value="">全部</option>
        </select>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- ==================== Settings ==================== -->
  <div id="view-settings" class="hidden">
    <div class="card">
      <h2>⚙️ 玩家名單</h2>
      <p style="font-size:0.85em;color:#ccc;margin-bottom:14px;">建立你的牌友名單，每次記錄時勾選當天有打的人。最多 12 位。</p>
      <div id="playerSettings"></div>
      <button class="btn btn-add btn-sm" style="margin-top:8px;width:100%;" onclick="addPlayerField()">➕ 新增玩家</button>
      <button class="btn btn-green btn-sm" style="margin-top:10px;width:100%;" onclick="savePlayers()">💾 儲存玩家名單</button>
    </div>
    <div class="card">
      <h2>💾 資料管理</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-outline" onclick="exportData()">📤 匯出 JSON 備份</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📥 匯入 JSON</button>
        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
        <button class="btn btn-danger" onclick="confirmClear()">🗑️ 清除所有資料</button>
      </div>
    </div>
    <div class="card">
      <h2>ℹ️ 使用說明</h2>
      <ul class="note-text">
        <li>在「設定」頁面建立你的牌友名單（6~8 位都可以）</li>
        <li>每次打完牌到「新增」頁面，勾選當天有打的人再輸入分數</li>
        <li>贏的分數填正數，輸的填負數，合計要為 0</li>
        <li>「總覽」會自動彙整當月和累計積分</li>
        <li>資料存在你的瀏覽器中（localStorage），換手機需匯出匯入</li>
        <li>建議定期用「匯出 JSON」備份</li>
      </ul>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modalContainer"></div>

<script>
var STORE_KEY = 'mahjong_score_v1';
var DEFAULT_PLAYERS = ['玩家A', '玩家B', '玩家C', '玩家D'];
var MAX_PLAYERS = 12;

function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { players: DEFAULT_PLAYERS.slice(), games: [] };
    var d = JSON.parse(raw);
    if (!d.players || !d.games) return { players: DEFAULT_PLAYERS.slice(), games: [] };
    return d;
  } catch(e) {
    return { players: DEFAULT_PLAYERS.slice(), games: [] };
  }
}

function saveData(data) {
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

var appData = loadData();

// ==================== Utilities ====================
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function fmtScore(n) {
  if (n > 0) return '+' + n;
  if (n < 0) return '' + n;
  return '0';
}

function scoreClass(n) {
  if (n > 0) return 'pos';
  if (n < 0) return 'neg';
  return 'zero';
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function ym(dateStr) {
  return dateStr ? dateStr.substring(0, 7) : '';
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function currentYM() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

function monthLabel(ymStr) {
  if (!ymStr) return '';
  var parts = ymStr.split('-');
  return parts[0] + ' 年 ' + parseInt(parts[1]) + ' 月';
}

// ==================== Tab Navigation ====================
function showTab(name) {
  var tabs = ['home', 'add', 'history', 'settings'];
  for (var i = 0; i < tabs.length; i++) {
    var v = document.getElementById('view-' + tabs[i]);
    var b = document.getElementById('tab-' + tabs[i]);
    if (tabs[i] === name) { v.classList.remove('hidden'); b.classList.add('active'); }
    else { v.classList.add('hidden'); b.classList.remove('active'); }
  }
  if (name === 'home') renderHome();
  if (name === 'add') renderAddForm();
  if (name === 'history') renderHistory();
  if (name === 'settings') renderSettings();
}

// ==================== Home View ====================
function renderHome() {
  var players = appData.players;
  var games = appData.games;
  var cm = currentYM();

  document.getElementById('currentMonthLabel').innerText = monthLabel(cm);

  var monthGames = games.filter(function(g) { return ym(g.date) === cm; });
  var monthScores = {};
  for (var i = 0; i < players.length; i++) monthScores[players[i]] = 0;
  for (var i = 0; i < monthGames.length; i++) {
    var s = monthGames[i].scores;
    for (var name in s) {
      if (name in monthScores) monthScores[name] += s[name];
    }
  }

  var statsHtml = '';
  var monthVals = Object.values(monthScores);
  var maxAbs = Math.max.apply(null, monthVals.map(Math.abs)) || 1;
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    statsHtml += '<div class="stat-card"><div class="label">' + p + '</div><div class="' + scoreClass(monthScores[p] || 0) + '">' + fmtScore(monthScores[p] || 0) + '</div></div>';
  }
  document.getElementById('monthStats').innerHTML = statsHtml;

  var chartHtml = '';
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    var val = monthScores[p] || 0;
    var pct = Math.abs(val) / maxAbs * 100;
    var color = val > 0 ? '#2ecc71' : val < 0 ? '#e74c3c' : '#666';
    chartHtml += '<div class="chart-bar-container">';
    chartHtml += '<div class="chart-bar-label"><span>' + p + '</span><span class="' + scoreClass(val) + '">' + fmtScore(val) + '</span></div>';
    chartHtml += '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>';
    chartHtml += '</div>';
  }
  document.getElementById('monthChart').innerHTML = chartHtml;

  var mgHtml = '<div style="margin-top:14px;font-size:0.85em;color:#ccc;">本月已打 <b style="color:#fff;">' + monthGames.length + '</b> 場</div>';
  document.getElementById('monthGames').innerHTML = mgHtml;

  // Total scores
  var totalScores = {};
  for (var i = 0; i < players.length; i++) totalScores[players[i]] = 0;
  for (var i = 0; i < games.length; i++) {
    var s = games[i].scores;
    for (var name in s) {
      if (name in totalScores) totalScores[name] += s[name];
    }
  }

  var totalVals = players.map(function(p) { return totalScores[p] || 0; });
  var maxAbsT = Math.max.apply(null, totalVals.map(Math.abs)) || 1;
  var tChartHtml = '';
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    var val = totalScores[p] || 0;
    var pctT = Math.abs(val) / maxAbsT * 100;
    var colorT = val > 0 ? '#2ecc71' : val < 0 ? '#e74c3c' : '#666';
    tChartHtml += '<div class="chart-bar-container">';
    tChartHtml += '<div class="chart-bar-label"><span>' + p + '</span><span class="' + scoreClass(val) + '">' + fmtScore(val) + '</span></div>';
    tChartHtml += '<div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pctT + '%;background:' + colorT + ';"></div></div>';
    tChartHtml += '</div>';
  }
  document.getElementById('totalChart').innerHTML = tChartHtml;

  var tStatsHtml = '';
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    tStatsHtml += '<div class="stat-card"><div class="label">' + p + '</div><div class="' + scoreClass(totalScores[p] || 0) + '">' + fmtScore(totalScores[p] || 0) + '</div></div>';
  }
  document.getElementById('totalStats').innerHTML = tStatsHtml;

  // Monthly summary
  var months = [];
  var seen = {};
  for (var i = 0; i < games.length; i++) {
    var m = ym(games[i].date);
    if (m && !seen[m]) { seen[m] = true; months.push(m); }
  }
  months.sort().reverse();

  if (months.length === 0) {
    document.getElementById('monthlySummary').innerHTML = '<div class="empty-msg">還沒有紀錄，先去新增幾場吧！</div>';
    return;
  }

  var msHtml = '<table><thead><tr><th>月份</th>';
  for (var i = 0; i < players.length; i++) msHtml += '<th>' + players[i] + '</th>';
  msHtml += '<th>場數</th></tr></thead><tbody>';
  for (var mi = 0; mi < months.length; mi++) {
    var m = months[mi];
    var mg = games.filter(function(g) { return ym(g.date) === m; });
    var ms = {};
    for (var i = 0; i < players.length; i++) ms[players[i]] = 0;
    for (var i = 0; i < mg.length; i++) {
      var s = mg[i].scores;
      for (var name in s) {
        if (name in ms) ms[name] += s[name];
      }
    }
    msHtml += '<tr><td>' + monthLabel(m) + '</td>';
    for (var j = 0; j < players.length; j++) {
      var val = ms[players[j]] || 0;
      msHtml += '<td class="' + scoreClass(val) + '">' + fmtScore(val) + '</td>';
    }
    msHtml += '<td>' + mg.length + '</td></tr>';
  }
  msHtml += '<tr style="border-top:2px solid rgba(255,255,255,0.2);"><td><b>合計</b></td>';
  for (var j = 0; j < players.length; j++) {
    var val = totalScores[players[j]] || 0;
    msHtml += '<td class="' + scoreClass(val) + '"><b>' + fmtScore(val) + '</b></td>';
  }
  msHtml += '<td><b>' + games.length + '</b></td></tr>';
  msHtml += '</tbody></table>';
  document.getElementById('monthlySummary').innerHTML = msHtml;
}

var pickMode = [];

function setWL(i, mode) {
  pickMode[i] = (pickMode[i] === mode) ? 0 : mode;
  document.getElementById('wlwin' + i).classList.toggle('active', pickMode[i] === 1);
  document.getElementById('wllose' + i).classList.toggle('active', pickMode[i] === -1);
  checkSum();
}

// ==================== Add Game Form ====================
function renderAddForm() {
  editingGameId = null;
  var players = appData.players;
  document.getElementById('gameDate').value = todayStr();

  var html = '';
  for (var i = 0; i < players.length; i++) {
    html += '<div class="player-pick" id="pick' + i + '" onclick="togglePick(' + i + ')">';
    html += '<div class="checkbox" id="cb' + i + '"></div>';
    html += '<div class="pname">' + players[i] + '</div>';
    html += '<div class="score-area" id="sa' + i + '">';
    html += '<button class="wl-btn wl-win" id="wlwin' + i + '" onclick="setWL(' + i + ',1);event.stopPropagation()">贏</button>';
    html += '<button class="wl-btn wl-lose" id="wllose' + i + '" onclick="setWL(' + i + ',-1);event.stopPropagation()">輸</button>';
    html += '<input type="number" class="score-input" id="pscore' + i + '" placeholder="金額" min="0" onclick="event.stopPropagation()" oninput="checkSum()">';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('playerPickList').innerHTML = html;
  document.getElementById('gameNote').value = '';
  document.getElementById('sumWarn').innerHTML = '';
  var addH2 = document.getElementById('view-add').querySelector('h2');
  if (addH2) addH2.innerText = '➕ 新增一場紀錄';
}

function togglePick(i) {
  var row = document.getElementById('pick' + i);
  var cb = document.getElementById('cb' + i);
  var inp = document.getElementById('pscore' + i);
  var sa = document.getElementById('sa' + i);
  if (row.classList.contains('checked')) {
    row.classList.remove('checked');
    cb.innerHTML = '';
    sa.classList.remove('active');
    inp.value = '';
    pickMode[i] = 0;
    document.getElementById('wlwin' + i).classList.remove('active');
    document.getElementById('wllose' + i).classList.remove('active');
  } else {
    row.classList.add('checked');
    cb.innerHTML = '✓';
    sa.classList.add('active');
  }
  checkSum();
}

function checkSum() {
  var players = appData.players;
  var sum = 0;
  var count = 0;
  for (var i = 0; i < players.length; i++) {
    var row = document.getElementById('pick' + i);
    if (row && row.classList.contains('checked')) {
      count++;
      var v = parseFloat(document.getElementById('pscore' + i).value);
      if (!isNaN(v)) { v = Math.abs(v) * (pickMode[i] || 1); sum += v; }
    }
  }
  var el = document.getElementById('sumWarn');
  if (count < 2) {
    el.innerHTML = '<span style="color:#ff8a80;">⚠ 請至少勾選 2 位玩家</span>';
    return;
  }
var unset = 0;
  for (var j = 0; j < players.length; j++) {
    var r2 = document.getElementById('pick' + j);
    if (r2 && r2.classList.contains('checked') && !pickMode[j]) unset++;
  }
  if (unset > 0) {
    el.innerHTML = '<span style="color:#ff8a80;">⚠ 有 ' + unset + ' 人尚未選擇贏/輸，合計 ' + sum + '</span>';
  } else if (sum === 0) {
    el.innerHTML = '<span style="color:#69f0ae;">✓ 合計為 0，共 ' + count + ' 人，正確！</span>';
  } else {
    el.innerHTML = '<span style="color:#ff8a80;">⚠ 合計為 ' + sum + '（' + count + ' 人），合計應為 0</span>';
  }
}

function saveGame() {
  var players = appData.players;
  var date = document.getElementById('gameDate').value;
  if (!date) { toast('請選擇日期'); return; }

  var scores = {};
  var count = 0;
  for (var i = 0; i < players.length; i++) {
    var row = document.getElementById('pick' + i);
    if (row && row.classList.contains('checked')) {
      count++;
      var v = parseFloat(document.getElementById('pscore' + i).value);
      if (isNaN(v)) v = 0;
      v = Math.abs(v) * (pickMode[i] || 1);
      scores[players[i]] = v;
    }
  }

  if (count < 2) { toast('請至少勾選 2 位玩家'); return; }

  var sum = 0;
  for (var name in scores) sum += scores[name];
  if (sum !== 0) {
    if (!confirm('合計為 ' + sum + '（非 0），仍要儲存嗎？')) return;
  }

  var note = document.getElementById('gameNote').value.trim();
  if (editingGameId) {
    var idx = appData.games.findIndex(function(g){ return g.id === editingGameId; });
    if (idx >= 0) {
      appData.games[idx].date = date;
      appData.games[idx].scores = scores;
      appData.games[idx].note = note;
    }
    editingGameId = null;
    toast('✓ 已更新！');
  } else {
    appData.games.push({ id: uid(), date: date, scores: scores, note: note });
    toast('✓ 已儲存！');
  }
  saveData(appData);
  resetForm();
  showTab('home');
}

function resetForm() {
  renderAddForm();
}

// ==================== History View ====================
function renderHistory() {
  var players = appData.players;
  var games = appData.games.slice().sort(function(a, b) {
    return b.date.localeCompare(a.date) || b.id.localeCompare(a.id);
  });

  var sel = document.getElementById('historyMonth');
  var currentVal = sel.value;
  var months = [];
  var seen = {};
  for (var i = 0; i < games.length; i++) {
    var m = ym(games[i].date);
    if (m && !seen[m]) { seen[m] = true; months.push(m); }
  }
  months.sort().reverse();
  sel.innerHTML = '<option value="">全部</option>';
  for (var i = 0; i < months.length; i++) {
    sel.innerHTML += '<option value="' + months[i] + '"' + (months[i] === currentVal ? ' selected' : '') + '>' + monthLabel(months[i]) + '</option>';
  }

  var filterVal = sel.value;
  var filtered = filterVal ? games.filter(function(g) { return ym(g.date) === filterVal; }) : games;

  if (filtered.length === 0) {
    document.getElementById('historyList').innerHTML = '<div class="empty-msg">還沒有紀錄</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var s = g.scores;
    var participantCount = Object.keys(s).length;
    html += '<div class="game-record">';
    html += '<div class="date">📅 ' + g.date + ' · ' + participantCount + ' 人';
    if (g.note) html += ' · ' + g.note;
    html += '</div>';
    html += '<div class="scores">';
    for (var name in s) {
      html += '<span class="score-chip"><span class="' + scoreClass(s[name]) + '">' + name + ' ' + fmtScore(s[name]) + '</span></span>';
    }
    html += '</div>';
    html += '<div class="actions">';
    html += '<button class="btn btn-outline btn-sm" onclick="editGame(\'' + g.id + '\')">✏ 編輯</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="deleteGame(\'' + g.id + '\')">🗑 刪除</button>';
    html += '</div>';
    html += '</div>';
  }
  document.getElementById('historyList').innerHTML = html;
}

function deleteGame(id) {
  if (!confirm('確定要刪除這場紀錄嗎？')) return;
  appData.games = appData.games.filter(function(g) { return g.id !== id; });
  saveData(appData);
  toast('已刪除');
  renderHistory();
}

var editingGameId = null;

function editGame(id) {
  var game = appData.games.find(function(g){ return g.id === id; });
  if (!game) return;
  editingGameId = id;
  showTab('add');
  document.getElementById('gameDate').value = game.date;
  document.getElementById('gameNote').value = game.note || '';
  var players = appData.players;
  for (var i = 0; i < players.length; i++) {
    if (game.scores.hasOwnProperty(players[i])) {
      var row = document.getElementById('pick' + i);
      var cb = document.getElementById('cb' + i);
      var sa = document.getElementById('sa' + i);
      var inp = document.getElementById('pscore' + i);
      row.classList.add('checked');
      cb.innerHTML = '\u2713';
      sa.classList.add('active');
      var raw = game.scores[players[i]];
      if (raw > 0) {
        pickMode[i] = 1;
        document.getElementById('wlwin' + i).classList.add('active');
        inp.value = raw;
      } else if (raw < 0) {
        pickMode[i] = -1;
        document.getElementById('wllose' + i).classList.add('active');
        inp.value = Math.abs(raw);
      } else {
        pickMode[i] = 0;
        inp.value = 0;
      }
    }
  }
  checkSum();
  document.getElementById('view-add').querySelector('h2').innerText = '\u270F \u7DE8\u8F2F\u7D00\u9304\uFF08\u4FEE\u6539\u5F8C\u6309\u5132\u5B58\u8986\u5BEB\uFF09';
}

// ==================== Settings View ====================
function renderSettings() {
  var players = appData.players;
  var html = '';
  for (var i = 0; i < players.length; i++) {
    html += '<div class="player-row">';
    html += '<input type="text" id="playerName' + i + '" value="' + players[i].replace(/"/g, '&quot;') + '" maxlength="12" placeholder="玩家' + (i+1) + '">';
    if (players.length > 2) {
      html += '<button class="remove-btn" onclick="removePlayerField(' + i + ')">✕</button>';
    }
    html += '</div>';
  }
  document.getElementById('playerSettings').innerHTML = html;

  var addBtn = document.querySelector('.btn-add');
  if (players.length >= MAX_PLAYERS) {
    addBtn.style.display = 'none';
  } else {
    addBtn.style.display = '';
  }
}

function addPlayerField() {
  var players = appData.players;
  if (players.length >= MAX_PLAYERS) { toast('最多 ' + MAX_PLAYERS + ' 位玩家'); return; }
  // Save current inputs first
  savePlayersFromInputs();
  appData.players.push('玩家' + (players.length + 1));
  renderSettings();
}

function removePlayerField(idx) {
  savePlayersFromInputs();
  var players = appData.players;
  if (players.length <= 2) { toast('至少需要 2 位玩家'); return; }
  if (!confirm('移除「' + players[idx] + '」？\n（已有的計分紀錄不受影響）')) return;
  appData.players.splice(idx, 1);
  saveData(appData);
  renderSettings();
}

function savePlayersFromInputs() {
  var players = appData.players;
  for (var i = 0; i < players.length; i++) {
    var el = document.getElementById('playerName' + i);
    if (el) {
      var v = el.value.trim();
      players[i] = v || ('玩家' + (i + 1));
    }
  }
}

function savePlayers() {
  savePlayersFromInputs();
  var players = appData.players;
  var seen = {};
  for (var i = 0; i < players.length; i++) {
    if (seen[players[i]]) { toast('❌ 有重複的名字：' + players[i]); return; }
    seen[players[i]] = true;
  }
  saveData(appData);
  toast('✓ 玩家名單已儲存');
}

// ==================== Data Export/Import ====================
function exportData() {
  var blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mahjong-score-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ 已匯出備份');
}

function importData(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var d = JSON.parse(e.target.result);
      if (!d.players || !d.games) throw new Error('format');
      if (!confirm('匯入將覆蓋現有資料，確定嗎？')) return;
      appData = d;
      saveData(appData);
      toast('✓ 匯入成功');
      renderSettings();
    } catch(err) {
      toast('❌ 檔案格式錯誤');
    }
  };
  reader.readAsText(file);
}

function confirmClear() {
  var html = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">';
  html += '<div class="modal">';
  html += '<h3>⚠️ 確認清除</h3>';
  html += '<p style="margin-bottom:16px;">這會刪除所有場次紀錄，無法復原。建議先匯出備份。</p>';
  html += '<p style="margin-bottom:16px;">確定要清除所有資料嗎？</p>';
  html += '<div style="display:flex;gap:10px;">';
  html += '<button class="btn btn-danger" style="flex:1;" onclick="clearAllData()">確定清除</button>';
  html += '<button class="btn btn-outline" style="flex:1;" onclick="closeModal()">取消</button>';
  html += '</div></div></div>';
  document.getElementById('modalContainer').innerHTML = html;
}

function clearAllData() {
  appData = { players: DEFAULT_PLAYERS.slice(), games: [] };
  saveData(appData);
  closeModal();
  toast('已清除所有資料');
  renderSettings();
}

function closeModal() {
  document.getElementById('modalContainer').innerHTML = '';
}

showTab('home');
</script>
</body>
</html>
